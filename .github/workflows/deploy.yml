name: Deploy
run-name: "Deploy to '${{ inputs.environment }}', config tag '${{ inputs.config_tag }}'${{ inputs.preview != '' && format(' + PREVIEW {0}', inputs.preview) || '' }}, pipeline '${{ github.ref_name }}', started by ${{ github.actor }}"

# Full deployment of one environment in one run:
#   plan     plans all modules (infra, databases, apps) and saves the plans. No approval needed to look.
#   apply    ONE approval for the environment, then applies exactly the saved plans in order
#            infra -> databases -> apps. Terraform refuses a plan that is stale.
#   promote  only after a successful TEST: updates ONE pull request per PROD configuration
#            ("promote/next") with the versions that ran on TEST. Feature flags are not promoted.
#   preview  optional, TEST only: deploys a build of a feature/scope branch without a release.
#            A preview is never promoted and is replaced by the next normal TEST deployment.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [test, prod-a, prod-b]
        required: true
      config_tag:
        description: Tag of the configuration repository, for example release/1.0.3
        type: string
        required: true
      preview:
        description: "TEST only: deploy a branch build without a release, for example app=preview/scope-big-feature-1a2b3c4"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment }}
  CONFIG_TAG: ${{ inputs.config_tag }}
  CONFIG_REPO: release-poc-config-${{ inputs.environment }}
  PREVIEW: ${{ inputs.preview }}
  MODULES: infra databases apps

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Check the pipeline version
        run: |
          echo "Pipeline: ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$ENVIRONMENT" != "test" ] && { [ "$GITHUB_REF_TYPE" != "tag" ] || [[ "$GITHUB_REF_NAME" != release/* ]]; }; then
            echo "::error::${ENVIRONMENT} only from a pipeline tag release/*. Choose the newest tag under 'Use workflow from', not a branch."
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Get the configuration ${{ inputs.config_tag }}
        run: |
          set -euo pipefail
          if ! git clone -q --depth 1 --branch "$CONFIG_TAG" \
               "https://github.com/${GITHUB_REPOSITORY_OWNER}/${CONFIG_REPO}.git" cfg 2>/dev/null; then
            echo "::error::Tag ${CONFIG_TAG} not found in ${CONFIG_REPO}. Did you create the configuration tag after the merge?"
            exit 1
          fi
          bash scripts/module-inputs.sh cfg inputs "$ENVIRONMENT"
          if [ -n "$PREVIEW" ]; then
            if [ "$ENVIRONMENT" != test ]; then
              echo "::error::A preview is only allowed on test. PROD gets releases only."; exit 1
            fi
            name=${PREVIEW%%=*} version=${PREVIEW#*=}
            [[ "$version" == preview/* ]] || { echo "::error::Preview version must start with preview/"; exit 1; }
            jq --arg n "$name" --arg v "$version" '.versions[$n] = $v' inputs/apps.json > inputs/a.tmp && mv inputs/a.tmp inputs/apps.json
            echo "**PREVIEW on TEST:** \`${name}\` = \`${version}\` (not a release, will not be promoted)" >> "$GITHUB_STEP_SUMMARY"
          fi
          bad=$(jq -r '.versions | to_entries[] | select(.value | startswith("release/") | not) | "\(.key)=\(.value)"' inputs/apps.json)
          if [ "$ENVIRONMENT" != test ] && [ -n "$bad" ]; then
            echo "::error::${ENVIRONMENT} accepts only release/* versions, found: ${bad}"; exit 1
          fi

      - name: Get the current state of ${{ inputs.environment }}
        run: bash scripts/state.sh get "$ENVIRONMENT"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform plan (all modules)
        id: plan
        run: |
          set -euo pipefail
          mkdir -p plans
          any=false
          {
            echo "### Plan for ${ENVIRONMENT} (config ${CONFIG_TAG})"
            echo ""
            echo "| Module | Create | Update | Replace | Delete |"
            echo "|---|---:|---:|---:|---:|"
          } > summary.md
          : > changes.md
          for m in $MODULES; do
            if [ "$m" = databases ] && [ "$ENVIRONMENT" = prod-b ]; then
              echo "| databases | skipped: read-only copy in the standby site, migrations only in prod-a | | | |" >> summary.md
              continue
            fi
            ( cd "terraform/$m"
              terraform init -input=false -no-color -reconfigure -backend-config="path=$GITHUB_WORKSPACE/state/$ENVIRONMENT/$m.tfstate" >/dev/null
              set +e
              terraform plan -input=false -no-color -detailed-exitcode -var-file="$GITHUB_WORKSPACE/inputs/$m.json" -out="$GITHUB_WORKSPACE/plans/$m.tfplan" > "$GITHUB_WORKSPACE/plans/$m.txt"
              echo $? > "$GITHUB_WORKSPACE/plans/$m.rc"
              set -e
              terraform show -json "$GITHUB_WORKSPACE/plans/$m.tfplan" > "$GITHUB_WORKSPACE/plans/$m.json"
            )
            rc=$(cat "plans/$m.rc")
            cat "plans/$m.txt"
            [ "$rc" -eq 1 ] && { echo "::error::Plan of module $m failed"; exit 1; }
            j="plans/$m.json"
            c=$(jq '[.resource_changes[]? | select(.change.actions == ["create"])] | length' "$j")
            u=$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' "$j")
            r=$(jq '[.resource_changes[]? | select(.change.actions | contains(["delete","create"]))] | length' "$j")
            d=$(jq '[.resource_changes[]? | select(.change.actions == ["delete"])] | length' "$j")
            echo "| $m | $c | $u | $r | $d |" >> summary.md
            if [ "$rc" -eq 2 ]; then
              any=true
              jq -r '.resource_changes[]? | select(.change.actions != ["no-op"])
                | "- `\(.address)`: \(.change.actions|join("/")) \((.change.before.input.image // .change.before.input.version // "") ) -> \((.change.after.input.image // .change.after.input.version // ""))"' "$j" >> changes.md
            else
              rm -f "plans/$m.tfplan"
            fi
          done
          echo "has_changes=$any" >> "$GITHUB_OUTPUT"
          {
            cat summary.md
            echo ""
            if [ "$any" = true ]; then
              echo "**What changes**"; echo ""; cat changes.md; echo ""
              echo "Only **update** is normal for a release. Create, replace or delete: stop and find out why."
            else
              echo "No changes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cp summary.md changes.md plans/

      - name: Save the plans
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plans-${{ inputs.environment }}
          path: |
            plans/
            inputs/
            cfg/terraform/
          retention-days: 5

  apply:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get the reviewed plans
        uses: actions/download-artifact@v8
        with:
          name: plans-${{ inputs.environment }}
          path: saved

      - name: Get the current state of ${{ inputs.environment }}
        run: bash scripts/state.sh get "$ENVIRONMENT"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Apply the saved plans in order (infra, databases, apps)
        run: |
          set -euo pipefail
          echo "### Applied on ${ENVIRONMENT}" >> "$GITHUB_STEP_SUMMARY"
          for m in $MODULES; do
            plan="$GITHUB_WORKSPACE/saved/plans/$m.tfplan"
            if [ ! -f "$plan" ]; then
              echo "- $m: no changes" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            ( cd "terraform/$m"
              terraform init -input=false -no-color -reconfigure -backend-config="path=$GITHUB_WORKSPACE/state/$ENVIRONMENT/$m.tfstate" >/dev/null
              terraform apply -input=false -no-color "$plan" )
            [ "$m" = databases ] && echo "  (database migrations simulated)"
            echo "- $m: applied" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Check application health (simulated)
        run: |
          if [ "$ENVIRONMENT" = "prod-b" ]; then
            echo "prod-b is the standby: no traffic, health check skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Health check OK (simulated)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save the new state
        run: bash scripts/state.sh put "$ENVIRONMENT" "${CONFIG_TAG}${PREVIEW:+ + preview $PREVIEW}" saved/cfg/terraform

  promote:
    needs: [plan, apply]
    if: inputs.environment == 'test' && inputs.preview == '' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    concurrency:
      group: promote
      cancel-in-progress: false
    steps:
      - name: Get a token for the release bot
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            release-poc-config-prod-a
            release-poc-config-prod-b

      - name: Update the pull requests for prod-a and prod-b
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$CONFIG_TAG" "https://github.com/${OWNER}/release-poc-config-test.git" tested
          bot_id=$(gh api "/users/${BOT_SLUG}%5Bbot%5D" -q .id)
          branch="promote/next"
          echo "### Promote config-test ${CONFIG_TAG}" >> "$GITHUB_STEP_SUMMARY"
          for env in prod-a prod-b; do
            repo="${OWNER}/release-poc-config-${env}"
            rm -rf "$env"
            git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$env"
            if cmp -s tested/terraform/versions.tfvars "$env/terraform/versions.tfvars"; then
              echo "- ${env}: already has these versions." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            changes=$(diff "$env/terraform/versions.tfvars" tested/terraform/versions.tfvars | sed -n 's/^> \(.*\)/- `\1`/p' || true)
            ( cd "$env"
              git config user.name "${BOT_SLUG}[bot]"
              git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
              git switch -q -C "$branch" origin/main
              cp ../tested/terraform/versions.tfvars terraform/versions.tfvars
              git commit -q -am "Promote config-test ${CONFIG_TAG}"
              git push -q --force origin "$branch" )
            title="${env}: promote config-test ${CONFIG_TAG}"
            body="These versions ran successfully on TEST ([run](${RUN_URL}), config-test ${CONFIG_TAG}).

          Changes compared with ${env} today:
          ${changes}

          This pull request always holds the newest tested versions: if more releases pass TEST before you merge, the bot updates it. Feature flags (features.tfvars) are not promoted, they stay per environment.

          After the merge the bot tags this configuration and starts the deployment. The apply waits for the approval of the environment ${env}."
            num=$(gh pr list --repo "$repo" --head "$branch" --state open --json number -q '.[0].number // empty')
            if [ -n "$num" ]; then
              gh pr edit "$num" --repo "$repo" --title "$title" --body "$body" >/dev/null
              url=$(gh pr view "$num" --repo "$repo" --json url -q .url); verb="updated"
            else
              url=$(gh pr create --repo "$repo" --head "$branch" --base main --title "$title" --body "$body"); verb="opened"
            fi
            echo "- ${env}: ${verb} ${url}" >> "$GITHUB_STEP_SUMMARY"
          done
