name: Deploy
run-name: "Deploy to '${{ inputs.environment }}', config tag '${{ inputs.config_tag }}', pipeline '${{ github.ref_name }}', started by ${{ github.actor }}"

# plan    reads versions.tfvars from the configuration tag, shows the plan and saves it.
# apply   waits for the approval of the environment (prod-a, prod-b), then applies exactly the saved plan.
#         If anything changed in between, Terraform refuses with "Saved plan is stale".
# promote only after a successful TEST: the release bot opens the pull requests for prod-a and prod-b
#         with the same versions.tfvars. One release, everything else follows.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [test, prod-a, prod-b]
        required: true
      config_tag:
        description: Tag of the configuration repository, for example release/1.0.3
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ inputs.environment }}
  CONFIG_TAG: ${{ inputs.config_tag }}
  CONFIG_REPO: release-poc-config-${{ inputs.environment }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Check the pipeline version
        run: |
          echo "Pipeline: ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$ENVIRONMENT" != "test" ] && { [ "$GITHUB_REF_TYPE" != "tag" ] || [[ "$GITHUB_REF_NAME" != release/* ]]; }; then
            echo "::error::${ENVIRONMENT} only from a pipeline tag release/*. Choose the newest tag under 'Use workflow from', not a branch."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Get the configuration ${{ inputs.config_tag }}
        run: |
          set -euo pipefail
          if ! git clone -q --depth 1 --branch "$CONFIG_TAG" \
               "https://github.com/${GITHUB_REPOSITORY_OWNER}/${CONFIG_REPO}.git" cfg 2>/dev/null; then
            echo "::error::Tag ${CONFIG_TAG} not found in ${CONFIG_REPO}. Did you create the configuration tag after the merge?"
            exit 1
          fi
          {
            echo "### Versions in ${CONFIG_REPO} @ ${CONFIG_TAG}"
            echo '```'
            cat cfg/terraform/versions.tfvars
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get the current state of ${{ inputs.environment }}
        run: |
          mkdir -p state
          if git fetch -q --depth 1 origin deploy-state 2>/dev/null \
             && git show "origin/deploy-state:state/${ENVIRONMENT}.tfstate" > "state/${ENVIRONMENT}.tfstate" 2>/dev/null; then
            echo "State found."
          else
            rm -f "state/${ENVIRONMENT}.tfstate"
            echo "No state yet: first deployment of ${ENVIRONMENT}."
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform plan
        id: plan
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config="path=../state/${ENVIRONMENT}.tfstate" >/dev/null
          set +e
          terraform plan -input=false -no-color -detailed-exitcode \
            -var-file=../cfg/terraform/versions.tfvars -var environment="$ENVIRONMENT" -out=tfplan > plan.txt
          rc=$?
          set -e
          cat plan.txt
          [ "$rc" -eq 1 ] && exit 1
          [ "$rc" -eq 2 ] && echo "has_changes=true" >> "$GITHUB_OUTPUT" || echo "has_changes=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan for ${ENVIRONMENT}"
            echo '```'
            grep -E '^\s+[~+-] |^\s+# |^Plan:|No changes' plan.txt || true
            echo '```'
            if [ "$rc" -eq 2 ]; then
              echo "Only **update in-place** is normal. Create, replace or destroy: stop and find out why."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.environment }}
          path: |
            terraform/tfplan
            cfg/terraform/versions.tfvars
          retention-days: 5

  apply:
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get the current state of ${{ inputs.environment }}
        run: |
          mkdir -p state
          git fetch -q origin deploy-state 2>/dev/null \
            && git show "origin/deploy-state:state/${ENVIRONMENT}.tfstate" > "state/${ENVIRONMENT}.tfstate" 2>/dev/null \
            || rm -f "state/${ENVIRONMENT}.tfstate"

      - name: Get the reviewed plan
        uses: actions/download-artifact@v4
        with:
          name: plan-${{ inputs.environment }}
          path: saved

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform apply (exactly the reviewed plan)
        working-directory: terraform
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -backend-config="path=../state/${ENVIRONMENT}.tfstate" >/dev/null
          terraform apply -input=false -no-color ../saved/terraform/tfplan
          {
            echo "### Running now on ${ENVIRONMENT}"
            echo '```'
            terraform output -no-color images
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check application health (simulated)
        run: |
          if [ "$ENVIRONMENT" = "prod-b" ]; then
            echo "prod-b is the standby: no traffic, health check skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Health check OK (simulated)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save the new state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "state/${ENVIRONMENT}.tfstate" /tmp/new.tfstate
          cp saved/cfg/terraform/versions.tfvars /tmp/new.versions.tfvars
          rm -rf state saved terraform/.terraform terraform/.terraform.lock.hcl
          if git show-ref -q --verify refs/remotes/origin/deploy-state; then
            git switch -q -C deploy-state origin/deploy-state
          else
            git switch -q --orphan deploy-state
            git rm -rq --cached . 2>/dev/null || true
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p state
          cp /tmp/new.tfstate "state/${ENVIRONMENT}.tfstate"
          cp /tmp/new.versions.tfvars "state/${ENVIRONMENT}.versions.tfvars"
          echo "${CONFIG_TAG}" > "state/${ENVIRONMENT}.config_tag"
          git add state
          git commit -q -m "${ENVIRONMENT}: ${CONFIG_TAG} (run ${GITHUB_RUN_ID})"
          for i in 1 2 3 4 5; do
            git push -q origin deploy-state && exit 0
            git pull -q --rebase origin deploy-state
          done
          echo "::error::Could not save the state." && exit 1

  promote:
    needs: [plan, apply]
    if: inputs.environment == 'test' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Get a token for the release bot
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            release-poc-config-prod-a
            release-poc-config-prod-b

      - name: Open the pull requests for prod-a and prod-b
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 --branch "$CONFIG_TAG" "https://github.com/${OWNER}/release-poc-config-test.git" tested
          bot_id=$(gh api "/users/${BOT_SLUG}%5Bbot%5D" -q .id)
          echo "### Promote config-test ${CONFIG_TAG}" >> "$GITHUB_STEP_SUMMARY"
          for env in prod-a prod-b; do
            repo="${OWNER}/release-poc-config-${env}"
            rm -rf "$env"
            git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$env"
            if cmp -s tested/terraform/versions.tfvars "$env/terraform/versions.tfvars"; then
              echo "- ${env}: already has these versions, no pull request." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            changes=$(diff "$env/terraform/versions.tfvars" tested/terraform/versions.tfvars | grep '^>' | sed 's/^> /- `/; s/$/`/' || true)
            branch="promote/test-${CONFIG_TAG//\//-}"
            cp tested/terraform/versions.tfvars "$env/terraform/versions.tfvars"
            (
              cd "$env"
              git config user.name "${BOT_SLUG}[bot]"
              git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
              git switch -q -c "$branch"
              git commit -q -am "Promote config-test ${CONFIG_TAG}"
              git push -q --force origin "$branch"
            )
            if gh pr view "$branch" --repo "$repo" >/dev/null 2>&1; then
              url=$(gh pr view "$branch" --repo "$repo" --json url -q .url)
            else
              url=$(gh pr create --repo "$repo" --head "$branch" --base main \
                --title "${env}: promote config-test ${CONFIG_TAG}" \
                --body "These versions ran successfully on TEST ([run](${RUN_URL}), config-test ${CONFIG_TAG}).

          Changes:
          ${changes}

          After the merge the bot tags this configuration and starts the deployment. The apply waits for the approval of the environment ${env}.")
            fi
            echo "- ${env}: ${url}" >> "$GITHUB_STEP_SUMMARY"
          done
